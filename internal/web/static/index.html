<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modbus 模拟器</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/static/favicon.svg?v=20260202m2">
    <link rel="shortcut icon" href="/static/favicon.svg?v=20260202m2">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-brand">
                <h1>Modbus 模拟器</h1>
                <span class="version-badge">v1.5</span>
            </div>
        </header>

        <main>
            <aside class="tree-panel">
                <div class="tree-header">
                    <span></span>
                    <div class="tree-header-actions">
                        <button id="importBtn" class="btn btn-sm">编辑</button>
                    </div>
                </div>
                <div id="deviceTree" class="device-tree"></div>
            </aside>

            <section class="content-panel">
                <div class="tabs" id="tabHeaders"></div>
                <div class="tab-content" id="tabContent">
                    <div class="empty-state">请从设备树中选择寄存器类型</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Connection Modal -->
    <div id="connectionModal" class="modal">
        <div class="modal-content">
            <h3 id="connectionModalTitle">添加设备</h3>
            <form id="connectionForm">
                <input type="hidden" id="connId">
                <input type="hidden" id="slaveId">
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" id="connName">
                    <small>填写驱动名称，例如：烟气分析仪_ZT_EM5</small>
                </div>
                <div class="form-group">
                    <label>端口 (不填则自动分配)</label>
                    <input type="number" id="connPort" min="1" max="65535" placeholder="不填则自动分配">
                </div>
                <div class="form-group">
                    <label>从机地址（10进制）</label>
                    <input type="number" id="slaveAddr" min="1" max="247">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal('connectionModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h3 id="registerModalTitle">添加寄存器</h3>
            <form id="registerForm">
                <input type="hidden" id="regConnId">
                <input type="hidden" id="regSlaveId">
                <input type="hidden" id="regId">
                <div class="form-group">
                    <label>起始地址<span class="required">*</span></label>
                    <input type="number" id="regStartAddr" required>
                    <small>1-9999: 线圈, 10001-19999: 离散输入, 30001-39999: 输入寄存器, 40001-49999: 保持寄存器</small>
                </div>
                <div class="form-group">
                    <label>十六进制数据<span class="required">*</span></label>
                    <input type="text" id="regHexData" pattern="[0-9A-Fa-f]+" required>
                    <small>十六进制字符串 (0-9, A-F)。寄存器: 每个寄存器 4 个字符。线圈: 每 8 位 2 个字符。</small>
                    <small class="form-warn">清空并保存会删除该寄存器块。</small>
                    <small class="form-error" id="regHexError" style="display:none"></small>
                </div>
                <div class="form-group">
                    <label>名称 (逗号分隔,可选)</label>
                    <input type="text" id="regNames">
                </div>
                <div class="form-group">
                    <label>系数 (逗号分隔,可选)</label>
                    <input type="text" id="regCoefficients">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal('registerModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Import Frames Modal -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑</h3>
                <div class="modal-header-actions">
                    <button type="button" class="btn" onclick="closeModal('importModal')">取消</button>
                    <button type="submit" class="btn btn-primary" form="importForm">保存</button>
                </div>
            </div>
            <div id="importSummary" class="import-summary"></div>
            <form id="importForm">
                <div class="form-group">
                    <label>设备<span class="required">*</span> <span class="label-hint">(可下拉选择已有设备)</span></label>
                    <select id="importConnId" required></select>
                </div>
                <div class="form-group" id="importNewConnNameGroup" style="display:none;">
                    <label>名称<span class="required">*</span></label>
                    <input type="text" id="importConnName" placeholder="填写驱动名称，例如：烟气分析仪_ZT_EM5">
                </div>
                <div class="form-group" id="importNewConnPortGroup" style="display:none;">
                    <label>端口</label>
                    <input type="number" id="importConnPort" min="1" max="65535" placeholder="不填则自动分配">
                </div>
                <div class="form-group">
                    <label>从报文导入数据 <span class="label-hint">(新增或更新寄存器数据)</span></label>
                    <small class="hint-strong">打开设备调试窗口，点击 <strong>获取数据</strong>/<strong>获取状态</strong>/<strong>获取报警</strong>/<strong>获取时间</strong> 将全部报文复制到这里：</small>
                    <textarea id="importFrames" rows="10" placeholder="【发送】【12:12:21】【烟气分析仪】：<01 04 00 14 00 01 71 CE>&#10;【接收】【12:12:22】【烟气分析仪】：<01 04 02 00 01 78 F0>"></textarea>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
